name: VoiceInk ChatGPT macOS

on:
  push:
    branches: [main, feature/chatgpt-native]
    paths-ignore:
      - README.md
      - AGENTS.md
      - AGENT_HANDOFF.md
      - PROJECT_STATUS.md
      - CHANGELOG.md
      - CHATGPT-BUILD.md
      - CHATGPT-INTEGRATION.md
      - .github/chatgpt-release-notes.md
      - docs/images/**
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified app DMG and ZIP as the latest public release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.package.outputs.build_number }}
      app_version: ${{ steps.package.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select supported Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Inspect native build toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          output = subprocess.check_output(['xcrun', 'swift', '--version'], text=True)
          print(output)
          version = re.search(r'Swift version (\d+)\.(\d+)', output)
          if not version or tuple(map(int, version.groups())) < (6, 3):
              sys.exit('Updated MLX dependencies require Swift 6.3 or later.')
          PY
      - name: Test ChatGPT protocol
        run: swift test
      - name: Test mode settings migration and backup round trips
        run: python3 scripts/test-chatgpt-mode-settings.py
      - name: Typecheck native ChatGPT client
        run: >-
          swiftc -typecheck -swift-version 5
          VoiceInk/Infrastructure/Providers/ChatGPT/ChatGPTProtocol.swift
          VoiceInk/Infrastructure/Providers/ChatGPT/ChatGPTClient.swift
          VoiceInk/Infrastructure/Credentials/KeychainService.swift
      - uses: actions/cache/restore@v4
        id: whisper-cache
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple
          key: whisper-macos-${{ runner.arch }}-4da27c41cebadb3cbbcd2563e9c7cbc8d84bdcad
      - name: Prepare Whisper for macOS
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-whisper-macos.sh
      - uses: actions/cache/save@v4
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple
          key: whisper-macos-${{ runner.arch }}-4da27c41cebadb3cbbcd2563e9c7cbc8d84bdcad
      - name: Build separate test app
        run: make local LOCAL_CODESIGN_IDENTITY=-
      - name: Verify and package app
        id: package
        run: bash scripts/package-chatgpt-macos.sh "$HOME/Downloads/VoiceInk ChatGPT.app" dist
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-ChatGPT-macOS
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
            dist/release-manifest.json
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: VoiceInk-ChatGPT-macOS
      - name: Publish verified DMG, ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.app_version }}-chatgpt-build${{ needs.build.outputs.build_number }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          set -euo pipefail
          shasum -a 256 -c SHA256SUMS
          APP_VERSION="${{ needs.build.outputs.app_version }}"
          PACKAGE="VoiceInk-${APP_VERSION}-ChatGPT-Build-${BUILD_NUMBER}"
          bash scripts/publish-chatgpt-release.sh "$RELEASE_TAG" "$APP_VERSION" "$BUILD_NUMBER" "$GITHUB_SHA"
